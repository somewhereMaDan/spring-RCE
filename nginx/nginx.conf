events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 127.0.0.11 - Docker's built-in DNS server inside user-defined Docker networks
    # valid=5s — Cache DNS results for 5 seconds before resolving again.

    upstream gateway_backend {
        zone gateway_backend 64k; # Allocates 64 KB of shared memory to maintain upstream server configuration and state across Nginx workers.
        server gateway:8081 resolve;
        # Resolves gateway-1 and gateway-2 using Docker DNS and dynamically updates its IP when it changes.
    }

    limit_req_zone $binary_remote_addr zone=submit:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=poll:10m   rate=20r/s;
    limit_req_status 429;

    server {
        listen 80;
        location / {
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /runs {
            limit_req zone=submit burst=5 nodelay;
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /runs/ {
            limit_req zone=poll burst=40 nodelay;
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}